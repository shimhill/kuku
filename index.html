<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かけざん れんしゅう帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
/* Layout: one centered column — score strip, big question card, number pad, then settings & にがてマップ below */
:root{
  --bg:#E9F2EF; --card:#FFFFFF; --ink:#1D2B4F; --muted:#5D6B86; --line:#CFDDD8;
  --accent:#F2643A; --sun:#FFC23D; --good:#2A9A66; --bad:#D6455A; --key:#F4F8F6;
  --display:"Mochiy Pop One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A2A; --card:#1B2740; --ink:#EAF0FA; --muted:#9FB0CC; --line:#2C3B5A;
  --accent:#FF845C; --sun:#FFD066; --good:#4CC48C; --bad:#FF6F84; --key:#22304D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111A2A; --card:#1B2740; --ink:#EAF0FA; --muted:#9FB0CC; --line:#2C3B5A;
  --accent:#FF845C; --sun:#FFD066; --good:#4CC48C; --bad:#FF6F84; --key:#22304D; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.score{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-size:1rem}

.streak{display:flex;align-items:center;gap:8px;justify-content:center}
.streak .lbl{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:background .2s,border-color .2s,transform .2s}
.dot.on{background:var(--sun);border-color:var(--sun);transform:scale(1.08)}

.qcard{background:var(--card);border-radius:22px;padding:22px 16px 18px;text-align:center;border:2px solid var(--line);position:relative}
.tag{position:absolute;top:10px;left:12px;font-size:.72rem;font-weight:700;color:var(--card);background:var(--bad);padding:3px 9px;border-radius:99px}
.q{font-family:var(--display);font-size:clamp(2.6rem,13vw,3.6rem);line-height:1.1;display:flex;justify-content:center;align-items:center;gap:.25em;font-variant-numeric:tabular-nums}
.q .op{color:var(--accent)}
.ans{min-width:2.2em;padding:0 .15em;border-bottom:4px solid var(--ink);color:var(--ink)}
.ans.empty{color:var(--line)}
.qcard.ok{border-color:var(--good)} .qcard.ok .ans{color:var(--good);border-color:var(--good)}
.qcard.ng{border-color:var(--bad);animation:shake .35s}
.qcard.ng .ans{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{min-height:1.6em;margin-top:10px;font-weight:700;font-size:1.05rem}
.fb.ok{color:var(--good)} .fb.ng{color:var(--bad)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-family:var(--display);font-size:1.6rem;padding:12px 0;border-radius:16px;border:2px solid var(--line);background:var(--key);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pad button:active{transform:translateY(2px)}
.pad .del{font-family:var(--body);font-weight:700;font-size:1rem;color:var(--muted)}
.pad .go{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--body);font-weight:900;font-size:1.2rem;letter-spacing:.1em}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

section.box{background:var(--card);border-radius:18px;border:2px solid var(--line);padding:14px}
.box h2{font-size:.9rem;margin:0 0 10px;font-weight:900;letter-spacing:.04em}
.box p.hint{margin:0 0 10px;font-size:.78rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--body);font-weight:700;font-size:.9rem;padding:6px 10px;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}

.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;font-variant-numeric:tabular-nums}
.map div{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;font-size:.7rem;border-radius:6px;font-weight:700}
.map .h{color:var(--muted)}
.map .c{background:var(--key);color:var(--muted)}
.map .w1{background:color-mix(in srgb,var(--bad) 28%,var(--card));color:var(--ink)}
.map .w2{background:color-mix(in srgb,var(--bad) 55%,var(--card));color:var(--ink)}
.map .w3{background:var(--bad);color:#fff}
.legend{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.reset{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost{font-family:var(--body);font-weight:700;font-size:.8rem;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.ghost.warn{border-color:var(--bad);color:var(--bad)}

.praise{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:20;padding:16px}
.praise .card{background:var(--card);border:3px solid var(--sun);border-radius:26px;padding:28px 22px;text-align:center;max-width:340px;width:100%;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.praise .big{font-family:var(--display);font-size:2.2rem;color:var(--accent);margin:0}
.praise .sub{font-weight:700;margin:8px 0 4px;font-size:1.05rem}
.praise .stars{font-size:2rem;color:var(--sun);letter-spacing:.15em;margin:6px 0}
.praise button{margin-top:14px;font-family:var(--body);font-weight:900;font-size:1.1rem;padding:12px 28px;border-radius:14px;border:0;background:var(--accent);color:#fff;cursor:pointer}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.monyhint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.8rem;color:var(--muted);font-weight:700}
.monyhint .mav{width:34px;height:44px;display:inline-block;flex:none}
.mav svg,.photo svg{width:100%;height:100%;display:block;overflow:visible}
.monyhint b{color:var(--accent);font-variant-numeric:tabular-nums}
.monyhint.near b{font-size:1rem}
.praise .card.mony{border-color:var(--accent);padding:16px 16px 22px}
.mony .photo{width:min(300px,76vw);aspect-ratio:1;max-width:100%;margin:0 auto;display:block;border-radius:20px;overflow:hidden;animation:hop 1.1s ease-in-out infinite}
.mony .photo img{width:100%;height:100%;display:block}
.monyhint .mav img{width:100%;height:100%;object-fit:contain;display:block}
#mTail{transform-origin:164px 162px;animation:tail .28s ease-in-out infinite alternate}
#mTongue{transform-origin:100px 116px;animation:tongue .6s ease-in-out infinite alternate}
.earL{transform-origin:56px 80px;animation:earL .9s ease-in-out infinite}
.earR{transform-origin:144px 80px;animation:earR .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1.5deg)}}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes tongue{from{transform:scaleY(1)}to{transform:scaleY(1.12)}}
@keyframes earL{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes earR{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.bubble{position:relative;background:var(--sun);color:#3A2A00;font-weight:900;border-radius:18px;padding:12px 14px;margin:16px 0 4px;line-height:1.5;font-size:1.05rem}
.bubble::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--sun)}
.mony .name{font-family:var(--display);color:var(--accent);font-size:1.5rem;margin:12px 0 0}
@keyframes wag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.qcard.ng,.praise .card,.mony .photo,#mTail,#mTongue,.earL,.earR{animation:none}.dot{transition:none}}
</style>

</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>かけざん <span>れんしゅう帳</span></h1>
    <div class="score" id="score">きょう <b id="sOk">0</b> もん せいかい<br>さいこう れんぞく <b id="sBest">0</b></div>
  </header>

  <div class="streak" aria-label="れんぞく せいかい">
    <span class="lbl">あと</span><div class="dots" id="dots"></div><span class="lbl">で ほめるよ</span>
  </div>
  <div class="monyhint" id="monyhint"><span class="mav" id="mav"></span><span id="monytxt">10もん れんぞくで モニーが ほめてくれるよ</span></div>

  <div class="qcard" id="qcard" aria-live="polite">
    <span class="tag" id="tag" hidden>もういちど</span>
    <div class="q"><span id="qa">7</span><span class="op">×</span><span id="qb">8</span><span class="op">=</span><span class="ans empty" id="ans">?</span></div>
    <div class="fb" id="fb"></div>
  </div>

  <div class="pad" id="pad">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="del" class="del">けす</button><button data-k="0">0</button><button data-k="clr" class="del">ぜんぶけす</button>
    <button data-k="go" class="go" id="go">こたえる</button>
  </div>

  <section class="box">
    <h2>れんしゅうする だん</h2>
    <div class="chips" id="dans"></div>
  </section>

  <section class="box">
    <h2>にがて マップ</h2>
    <p class="hint">まちがえた もんだいほど 赤くなって、よく でてくるよ。せいかいすると うすくなる。</p>
    <div class="map" id="map"></div>
    <div class="legend"><span><i style="background:var(--key)"></i>だいじょうぶ</span><span><i style="background:color-mix(in srgb,var(--bad) 40%,var(--card))"></i>ちょっと にがて</span><span><i style="background:var(--bad)"></i>にがて</span></div>
    <div class="reset" id="resetBox"><button class="ghost" id="reset">きろくを リセット</button></div>
  </section>
</div>

<div class="praise" id="praise" hidden role="dialog" aria-modal="true">
  <div class="card">
    <p class="big" id="pBig">すごい！</p>
    <div class="stars" id="pStars">★★★★★</div>
    <p class="sub" id="pSub">5かい れんぞく せいかい！</p>
    <button id="pClose">つづける</button>
  </div>
</div>

<div class="praise" id="monyPraise" hidden role="dialog" aria-modal="true" aria-label="モニーから">
  <div class="card mony">
    <div class="photo" id="mpic" role="img" aria-label="モニー"></div>
    <p class="name">モニー</p>
    <div class="bubble" id="mSay">ワンワン！</div>
    <button id="mClose">ありがとう モニー!</button>
  </div>
</div>

<script>
(function(){
const KEY='kakezan-v1';
const $=id=>document.getElementById(id);
let S={weak:{},dans:[1,2,3,4,5,6,7,8,9],best:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.weak) S=Object.assign(S,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

let cur=null,input='',streak=0,todayOk=0,locked=false,last=null;
let retry=[]; // {k, due}

const k=(a,b)=>a+'x'+b;
const w=(key)=>S.weak[key]||0;

function pick(){
  retry.forEach(r=>r.due--);
  const i=retry.findIndex(r=>r.due<=0 && S.dans.includes(+r.k.split('x')[0]) && r.k!==last);
  if(i>=0){const r=retry.splice(i,1)[0];const [a,b]=r.k.split('x').map(Number);return {a,b,again:true};}
  const pool=[];
  S.dans.forEach(a=>{for(let b=1;b<=9;b++){const key=k(a,b);if(key===last&&S.dans.length*9>1)continue;pool.push({a,b,wt:1+w(key)*4});}});
  let t=pool.reduce((s,p)=>s+p.wt,0)*Math.random();
  for(const p of pool){t-=p.wt;if(t<=0)return {a:p.a,b:p.b,again:false};}
  const p=pool[pool.length-1];return {a:p.a,b:p.b,again:false};
}

function next(){
  cur=pick(); last=k(cur.a,cur.b); input=''; locked=false;
  $('qa').textContent=cur.a; $('qb').textContent=cur.b;
  $('tag').hidden=!cur.again;
  $('qcard').className='qcard'; $('fb').className='fb'; $('fb').textContent='';
  $('go').textContent='こたえる';
  drawAns();
}
function drawAns(){const el=$('ans');el.textContent=input||'?';el.classList.toggle('empty',!input);}

function answer(){
  if(locked){next();return;}
  if(!input)return;
  locked=true;
  const key=k(cur.a,cur.b), right=cur.a*cur.b, ok=+input===right;
  if(ok){
    S.weak[key]=Math.max(0,w(key)-1); if(!S.weak[key])delete S.weak[key];
    streak++; todayOk++; if(streak>S.best)S.best=streak;
    $('qcard').className='qcard ok'; $('fb').className='fb ok';
    $('fb').textContent=pickOne(['せいかい！','やったね！','いいね！','ばっちり！']);
    save(); drawStats(); drawDots();
    if(streak%10===0){setTimeout(()=>monyPraise(),450);}
    else if(streak%5===0){setTimeout(()=>praise(),450);}
    else setTimeout(next,700);
  }else{
    S.weak[key]=Math.min(6,w(key)+2);
    retry=retry.filter(r=>r.k!==key); retry.push({k:key,due:3});
    streak=0;
    $('qcard').className='qcard ng'; $('fb').className='fb ng';
    $('fb').textContent=`こたえは ${right}。${cur.a}×${cur.b}=${right} を おぼえよう`;
    $('go').textContent='つぎへ';
    save(); drawStats(); drawDots();
  }
  drawMap();
}
const pickOne=a=>a[Math.floor(Math.random()*a.length)];

function press(key){
  if(key==='go')return answer();
  if(locked)return;
  if(key==='del')input=input.slice(0,-1);
  else if(key==='clr')input='';
  else if(input.length<2)input=(input+key).replace(/^0+(?=\d)/,'');
  drawAns();
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)press(b.dataset.k);});
document.addEventListener('keydown',e=>{
  if(!$('praise').hidden||!$('monyPraise').hidden){if(e.key==='Enter'||e.key===' '){e.preventDefault();closePraise();}return;}
  if(e.target.closest&&e.target.closest('.box'))return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')press('del');
  else if(e.key==='Enter'){e.preventDefault();press('go');}
});

function drawDots(){
  const n=streak%5===0&&streak>0?5:streak%5;
  $('dots').innerHTML=Array.from({length:5},(_,i)=>`<span class="dot${i<n?' on':''}"></span>`).join('');
  const left=10-(streak%10);
  $('monyhint').classList.toggle('near',left<=3);
  $('monytxt').innerHTML=streak%10===0&&streak>0?'モニーが よろこんでるよ！'
    :streak===0?'10もん れんぞくで モニーが ほめてくれるよ'
    :`モニーが ほめてくれるまで あと <b>${left}</b> もん`;
}
function drawStats(){$('sOk').textContent=todayOk;$('sBest').textContent=S.best;}

function drawDans(){
  $('dans').innerHTML=Array.from({length:9},(_,i)=>i+1).map(d=>`<button class="chip${S.dans.includes(d)?' on':''}" data-d="${d}" aria-pressed="${S.dans.includes(d)}">${d}のだん</button>`).join('')+
    `<button class="chip" data-d="all">ぜんぶ</button><button class="chip" data-d="weak">にがてだけ</button>`;
}
$('dans').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;const d=b.dataset.d;
  if(d==='all')S.dans=[1,2,3,4,5,6,7,8,9];
  else if(d==='weak'){const ds=[...new Set(Object.keys(S.weak).map(x=>+x.split('x')[0]))].sort();
    if(!ds.length){$('fb').className='fb ok';$('fb').textContent='にがては まだ ないよ！';return;} S.dans=ds;}
  else{const n=+d;S.dans=S.dans.includes(n)?S.dans.filter(x=>x!==n):[...S.dans,n].sort();if(!S.dans.length)S.dans=[n];}
  save();drawDans();if(!locked)next();
});

function drawMap(){
  let h='<div class="h">×</div>';for(let b=1;b<=9;b++)h+=`<div class="h">${b}</div>`;
  for(let a=1;a<=9;a++){h+=`<div class="h">${a}</div>`;for(let b=1;b<=9;b++){const v=w(k(a,b));
    const c=v>=5?'w3':v>=3?'w2':v>=1?'w1':'c';h+=`<div class="${c}" title="${a}×${b}">${a*b}</div>`;}}
  $('map').innerHTML=h;
}

$('resetBox').addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='reset')$('resetBox').innerHTML='<span style="font-size:.8rem">ほんとうに けす？</span><button class="ghost warn" id="yes">けす</button><button class="ghost" id="no">やめる</button>';
  else if(id==='yes'){S.weak={};S.best=0;retry=[];save();drawMap();drawStats();$('resetBox').innerHTML='<button class="ghost" id="reset">きろくを リセット</button>';}
  else if(id==='no')$('resetBox').innerHTML='<button class="ghost" id="reset">きろくを リセット</button>';
});

function praise(){
  const m=streak>=20?['くくマスター！','もう だれにも まけない！']:streak>=15?['とまらない！','すごい しゅうちゅうりょく！']:streak>=10?['てんさい！','10かいも れんぞく！']:['すごい！','その ちょうし！'];
  $('pBig').textContent=m[0];
  $('pSub').textContent=`${streak}かい れんぞく せいかい！ ${m[1]}`;
  $('pStars').textContent='★'.repeat(Math.min(5,streak/5|0)+0).padEnd(5,'☆');
  $('praise').hidden=false; $('pClose').focus(); confetti();
}
function closePraise(){$('praise').hidden=true;$('monyPraise').hidden=true;next();}
$('pClose').addEventListener('click',closePraise);
function monyPraise(){
  const n=streak;
  const lines=n>=50?[`ワオーン！${n}もん れんぞく！くくの ちゃんぴおんだワン！`,`ワンワンワン！${n}もん！モニー もう びっくりだワン！`]
    :n>=30?[`ワンワン！${n}もん れんぞく！しっぽが とまらないワン！`,`ワン！${n}もんも れんぞく！ごほうびの おやつ わけてあげるワン！`]
    :n>=20?[`ワンワン！20もん れんぞく！ほんとに すごいワン！`,`ワン！20もん！いっしょに おさんぽで おいわいしよう！`]
    :[`ワンワン！10もん れんぞく せいかい！すごいワン！`,`ワン！10もん れんぞく！モニー うれしくて しっぽ ふりふりだワン！`,`クゥーン！10もん れんぞく！なでなで してほしいワン！`];
  $('mSay').textContent=pickOne(lines);
  setMonyPic();
  $('monyPraise').hidden=false; $('mClose').focus(); confetti();
}
$('mClose').addEventListener('click',closePraise);

const cv=$('fx'),cx=cv.getContext('2d');
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--sun','--good','--bad'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,r:Math.random()*6+4,c:cols[Math.random()*4|0],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let t=0;(function f(){cx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
    if(++t<130)requestAnimationFrame(f);else cx.clearRect(0,0,innerWidth,innerHeight);})();
}

const MONY_STICKER='images/mony-sticker.webp';
$('mav').innerHTML=`<img src="${MONY_STICKER}" alt="">`;
let lastPic=-1;
function setMonyPic(){let i;do{i=Math.floor(Math.random()*MONY_PICS.length)}while(i===lastPic&&MONY_PICS.length>1);lastPic=i;
  $('mpic').innerHTML=`<img src="${MONY_PICS[i]}" alt="モニー">`;}

drawDans();drawMap();drawStats();drawDots();next();
})();
</script>
